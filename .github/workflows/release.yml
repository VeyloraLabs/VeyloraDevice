name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (leave empty to use app/__init__.py)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux-x86_64
          - os: windows-latest
            name: Windows-x86_64
          - os: macos-15
            name: macOS-arm64
          - os: macos-15-intel
            name: macOS-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libxcb-cursor0 libegl1 libxkbcommon-x11-0 libgl1 libdbus-1-3

      - name: Build (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION_ARGS=()
          if [ -n "${{ steps.version.outputs.value }}" ]; then VERSION_ARGS=(--version "${{ steps.version.outputs.value }}"); fi
          ./packaging/build.sh --yes "${VERSION_ARGS[@]}"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "${{ steps.version.outputs.value }}"
          if ($Version) { ./packaging/windows/build.ps1 -Yes -Version $Version } else { ./packaging/windows/build.ps1 -Yes }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: packaging/compilation/${{ matrix.name }}/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Combine the checksums
        run: |
          mkdir -p upload
          find release-files -type f ! -name SHA256SUMS -exec cp {} upload/ \;
          cat release-files/*/SHA256SUMS > upload/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
